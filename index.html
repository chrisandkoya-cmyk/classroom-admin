<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบธุรการในชั้นเรียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar; home is a grid of the teacher's subjects; inside a subject a tab strip switches between attendance, work, scores, tools and report. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e7ecea; --ink:#16231f; --muted:#5c6c66; --line:#d3dcd8;
  --brand:#0f5c4c; --brand-ink:#ffffff; --saffron:#d98a1c; --saffron-soft:#fbefdc;
  --ok:#1f8a4c; --ok-soft:#dff2e6; --warn:#b26a00; --warn-soft:#fbecd2; --bad:#c0392b; --bad-soft:#f8dedb; --info:#2c62a8; --info-soft:#dfe9f7;
  --display:"Prompt","Sarabun",system-ui,sans-serif; --body:"Sarabun",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#17221f; --sunk:#1e2b27; --ink:#e4ece9; --muted:#97a8a1; --line:#2c3b36;
  --brand:#3fb393; --brand-ink:#08201a; --saffron:#f0a940; --saffron-soft:#3a2c14;
  --ok:#55c983; --ok-soft:#173a26; --warn:#f0b04a; --warn-soft:#3b2d12; --bad:#f07466; --bad-soft:#40201c; --info:#7fb0f0; --info-soft:#1b2c44; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#17221f; --sunk:#1e2b27; --ink:#e4ece9; --muted:#97a8a1; --line:#2c3b36;
  --brand:#3fb393; --brand-ink:#08201a; --saffron:#f0a940; --saffron-soft:#3a2c14;
  --ok:#55c983; --ok-soft:#173a26; --warn:#f0b04a; --warn-soft:#3b2d12; --bad:#f07466; --bad-soft:#40201c; --info:#7fb0f0; --info-soft:#1b2c44; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.45rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 240px;background:none;border:0;color:inherit;text-align:left;padding:0}
.seal{width:36px;height:36px;border-radius:50%;background:var(--saffron);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#2a1a00;flex:none}
.logo b{font-family:var(--display);font-weight:600;display:block;font-size:1rem;line-height:1.2}
.logo small{opacity:.8;font-size:.78rem;display:block}
.who{font-size:.85rem;opacity:.9}
.top .wrap{max-width:none;min-height:56px}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);height:calc(100vh - 56px - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:12px 10px 12px max(10px,env(safe-area-inset-left,0px));display:grid;gap:4px;align-content:start}
.side .lbl{font-size:.75rem;color:var(--muted);padding:10px 10px 2px;letter-spacing:.02em}
.side button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:11px 12px;text-align:left;font-weight:500;font-size:1rem;color:var(--ink);min-height:48px;width:100%}
.side button:hover{background:var(--sunk)}
.side button[aria-current="page"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.side svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .dot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 6px}
.side .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side hr{border:0;border-top:1px solid var(--line);margin:6px 4px;width:auto}
main .wrap{max-width:1000px;margin:0}
@media (max-width:760px){
 .shell{grid-template-columns:72px minmax(0,1fr)}
 .side{padding:8px 4px 8px max(4px,env(safe-area-inset-left,0px))}
 .side button{flex-direction:column;gap:3px;padding:8px 2px;font-size:.68rem;text-align:center;line-height:1.2}
 .side .tx{white-space:normal}
 .side .lbl,.side .subjbtn{display:none}
 main .wrap{padding-left:12px}
 .logo small,.who{display:none}
}
main .wrap{padding-block:20px 48px;display:grid;gap:18px}
.bar{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:end;justify-content:flex-start}
.bar.acts{align-items:center}
.bar .grp{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label.f{display:grid;gap:3px;font-size:.8rem;color:var(--muted)}
select,input[type=text],input[type=password],input[type=search],input[type=url],input[type=date],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;color:var(--ink)}
textarea{width:100%;resize:vertical;min-height:80px;font-family:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;font-weight:600;min-height:44px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.small{padding:4px 10px;font-size:.85rem}
.link{border:0;background:none;color:var(--brand);padding:0;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.note{font-size:.82rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.tile .k{font-size:.8rem;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.tile .s{font-size:.8rem;color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.8rem;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--sunk);color:var(--muted)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-width:54px;min-height:40px;padding:6px 10px;font-size:.95rem}
.seg button[aria-pressed="true"]{color:var(--surface);font-weight:600}
.seg button[aria-pressed="true"][data-s="P"],.seg button[aria-pressed="true"][data-v="sent"]{background:var(--ok);border-color:var(--ok)}
.seg button[aria-pressed="true"][data-s="L"],.seg button[aria-pressed="true"][data-v="late"]{background:var(--warn);border-color:var(--warn)}
.seg button[aria-pressed="true"][data-s="E"]{background:var(--info);border-color:var(--info)}
.seg button[aria-pressed="true"][data-s="A"],.seg button[aria-pressed="true"][data-v="none"]{background:var(--bad);border-color:var(--bad)}
.seg.rooms button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.sid{font-size:.78rem;color:var(--muted);display:block}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:70px;flex:1}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}
.mrow{display:flex;gap:8px;align-items:center;min-width:120px}
.score{width:64px;text-align:right}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.subj{display:grid;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;border-top:4px solid var(--c,var(--brand))}
.subj:hover{border-color:var(--c,var(--brand))}
.subj .code{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.subj .foot{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.add{display:grid;place-items:center;border:2px dashed var(--line);border-radius:var(--r);background:none;color:var(--muted);min-height:160px;font-weight:600}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%}
.item .t{min-width:0;flex:1 1 220px}
button.item:hover{border-color:var(--brand)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.tool{display:grid;gap:12px;align-content:start}
.picked{font-family:var(--display);font-size:1.6rem;font-weight:600;text-align:center;padding:18px 8px;border-radius:var(--r);background:var(--saffron-soft);min-height:84px;display:grid;place-items:center}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.groups div{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:.85rem}
.groups b{display:block;font-family:var(--display)}
.post{border-left:3px solid var(--saffron);padding:4px 10px}
.timer{font-family:var(--display);font-size:2.6rem;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;z-index:20;max-width:calc(100% - 32px);text-align:center}
.demo{font-size:.78rem;color:var(--muted);text-align:center;padding-bottom:24px}
.banner{background:var(--saffron-soft);border:1px solid var(--saffron);border-radius:var(--r);padding:10px 14px;font-size:.9rem}
@media (max-width:560px){.seg button{min-width:34px;padding:6px 3px;font-size:.85rem}.seg{gap:3px}.hide-sm{display:none}.tiles{grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px}.tile{padding:8px 10px}.tile .v{font-size:1.25rem}th,td{padding:8px 6px}}

.status{font-size:.85rem;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.18);padding:4px 12px;border-radius:999px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--saffron);display:inline-block}
.status[data-s="saved"] i{background:#7be0a4}.status[data-s="error"] i{background:#ff8a7a}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.form{display:grid;gap:14px;max-width:760px}
.form label.f input{width:100%}
.lv{display:grid;gap:6px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:var(--surface);cursor:pointer;min-height:40px}
.checks label:has(input:checked){background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.checks input{accent-color:var(--saffron)}
.dates{display:flex;gap:6px;flex-wrap:wrap}
.dates button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem}
.dates button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.shell.solo{grid-template-columns:minmax(0,1fr)}.shell.solo .side{display:none}
.login{max-width:440px;margin:24px auto;width:100%}
.login input{width:100%;min-height:46px;font-size:1.05rem}
.top .btn.small{min-height:34px;color:var(--ink)}
.work{display:grid;gap:4px;border-left:3px solid var(--saffron);padding:4px 10px;margin-top:6px;font-size:.9rem}
.work p{margin:0}.work a{color:var(--brand);word-break:break-all}
.search{flex:1 1 220px;max-width:360px}
.search input{width:100%;min-height:44px;font-size:1rem;padding:8px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
button.stu{font-weight:500;color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
button.stu:hover{color:var(--brand);text-decoration-color:var(--brand)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.kv dt{color:var(--muted);font-size:.85rem}.kv dd{margin:0}
.chipsd{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <button class="logo" id="go-home"><span class="seal">ส</span><span><b>ระบบธุรการในชั้นเรียน</b><small>วิทยาลัยเทคโนโลยีหลวงปู่สรวงวัดไพรพัฒนา · ภาคเรียน 2/2569</small></span></button>
  <span class="status" id="status" data-s="saved" hidden><i></i><span id="status-t">บันทึกแล้ว</span></span>
  <span class="who" id="who"></span><button class="btn small" id="pw-open" hidden>เปลี่ยนรหัสผ่าน</button><button class="btn small" id="logout" hidden>ออกจากระบบ</button>
</div></header>
<div class="shell"><nav class="side" id="side" aria-label="เมนูหลัก"></nav><main><div class="wrap" id="view"><div class="empty">กำลังโหลดข้อมูล…</div></div></main></div>
<div class="toast" id="toast" hidden></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// หากนำไฟล์ Index.html ไปเปิดนอก Google Apps Script (เช่น GitHub Pages / เว็บโรงเรียน / เปิดไฟล์ตรง)
// สามารถวางลิงก์ Web App (.../exec) ที่ตัวแปร DEFAULT_API_URL ด้านล่างเพื่อไม่ให้ติดหน้า Google ไดรฟ์เมื่อล็อกอินหลายบัญชี
const DEFAULT_API_URL="";
const ST={P:"มา",L:"สาย",E:"ลา",A:"ขาด"}, MIN_ATT=80, COLORS=["#0f5c4c","#d98a1c","#2c62a8","#8a3fa0","#b0413e","#3d7d8c"];
const LEVELS=["ปวช.1","ปวช.2","ปวช.3","ปวส.1","ปวส.2"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=iso(new Date());
const TM=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],TD=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
function thaiDate(s,long){if(!s)return "-";const d=new Date(s+"T00:00");if(isNaN(d))return esc(s);return (long?"วัน"+TD[d.getDay()]+"ที่ ":"")+`${d.getDate()} ${TM[d.getMonth()]} ${String(d.getFullYear()+543).slice(2)}`}
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
const sv=d=>`<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON={home:sv('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'),att:sv('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>'),work:sv('<path d="M7 3h8l4 4v14H7z"/><path d="M10 12h6M10 16h6"/>'),score:sv('<path d="M5 20V10M12 20V4M19 20v-7"/>'),tools:sv('<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>'),report:sv('<path d="M4 5h16v14H4z"/><path d="M4 10h16M10 10v9"/>'),add:sv('<path d="M12 5v14M5 12h14"/>'),search:sv('<circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/>')};
const TABS=[["att","เช็กชื่อ"],["work","สั่งงาน ตรวจงาน"],["score","คะแนน"],["tools","เครื่องมือ"],["report","รายงาน"]];

    if(!["subjects","att","subs","exams"].includes(coll))fail("คำขอไม่ถูกต้อง");
    if(coll==="subjects"){
      const ex=db.docs.find(x=>x.coll==="subjects"&&x.id===id);
      if(ex&&ex.owner!==s.user)fail("ไม่พบรายวิชานี้ในบัญชีของคุณ");
      if(!String(data.name||"").trim()||!(data.rooms||[]).length)fail("รายวิชาต้องมีชื่อและห้องเรียน");
      data.owner=s.user;
      putDoc("subjects",id,s.user,id,data);
    }else{
      const sid=String(data.sid||"");
      ownSubj(s,sid);
      putDoc(coll,id,s.user,sid,data);
    }
    save();return {};
  }
  if(name==="remove"){
    const s=sess();need(s,["teacher"]);
    if(p.coll==="subjects"){
      ownSubj(s,p.id);
      db.docs=db.docs.filter(d=>d.sid!==p.id);
    }else if(p.coll==="subs"||p.coll==="att"){
      const sid=String(p.sid||(p.id||"").split("_")[0]||"");
      if(sid)ownSubj(s,sid);
      db.docs=db.docs.filter(x=>!(x.coll===p.coll&&x.id===p.id)&&!(p.coll==="subs"&&x.coll==="work"&&x.id.startsWith(p.id+"_")));
    }else fail("คำขอไม่ถูกต้อง");
    save();return {};
  }
  if(name==="submit"){
    const s=sess();need(s,["student"]);
    const text=String(p.text||"").slice(0,5000),link=String(p.link||"").trim().slice(0,500);
    if(link&&!/^https?:\/\//i.test(link))fail("ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://");
    if(!text.trim()&&!link&&!p.fileB64)fail("พิมพ์คำตอบ แนบลิงก์ หรือแนบไฟล์อย่างน้อยหนึ่งอย่าง");
    const subjDoc=db.docs.find(d=>d.coll==="subjects"&&d.id===p.sid);
    const so=subjDoc&&JSON.parse(subjDoc.json||"{}");
    if(!so||!(so.rooms||[]).includes(s.rid))fail("ไม่พบรายวิชานี้");
    const task=(so.tasks||[]).find(t=>t.id===p.tid);
    if(!task)fail("ไม่พบงานนี้");
    const id=p.sid+"_"+p.tid+"_"+s.user;
    const prev=db.docs.find(d=>d.coll==="work"&&d.id===id);
    const file=p.fileB64?{name:String(p.fileName||"file"),url:"data:"+(p.mime||"application/octet-stream")+";base64,"+p.fileB64}:(prev?JSON.parse(prev.json||"{}").file:null);
    const isLate=!!(task.due&&TODAY>task.due);
    const data={sid:p.sid,tid:p.tid,stu:s.user,text,link,file,at:new Date().toISOString(),late:isLate};
    putDoc("work",id,s.user,p.sid,data);
    const subsId=p.sid+"_"+p.tid,subsDoc=db.docs.find(d=>d.coll==="subs"&&d.id===subsId);
    if(subsDoc){
      const sj=JSON.parse(subsDoc.json||"{}");
      if(sj&&sj.m&&sj.m[s.user]&&(sj.m[s.user].rej||sj.m[s.user].st==="none")){
        delete sj.m[s.user].rej;
        sj.m[s.user].st=isLate?"late":"sent";
        putDoc("subs",subsId,subsDoc.owner,p.sid,sj);
      }
    }
    save();return data;
  }
  if(name==="saveUser"){
    const s=sess();need(s,["admin"]);
    const username=String(p.username||"").trim().toLowerCase(),uName=String(p.name||"").trim();
    if(!/^[a-z0-9._-]{3,30}$/.test(username))fail("ชื่อผู้ใช้ใช้ได้เฉพาะ a-z 0-9 . _ - ยาว 3-30 ตัว");
    if(!uName)fail("กรอกชื่อ-สกุลของครู");
    if(db.users.some(u=>u.username.toLowerCase()===username))fail("มีชื่อผู้ใช้นี้แล้ว");
    const pw=String(p.password||"")||randPw_();
    if(pw.length<6)fail("รหัสผ่านต้องยาวอย่างน้อย 6 ตัว");
    db.users.push({username,name:uName,role:"teacher",pass:pw});
    save();return {username,password:pw};
  }
  if(name==="resetUser"){
    const s=sess();need(s,["admin"]);
    const u=db.users.find(x=>x.username===String(p.username).trim());
    if(!u)fail("ไม่พบผู้ใช้");
    const pw=randPw_();u.pass=pw;save();
    return {username:u.username,password:pw};
  }
  if(name==="deleteUser"){
    const s=sess();need(s,["admin"]);
    const u=db.users.find(x=>x.username===String(p.username).trim());
    if(!u)fail("ไม่พบผู้ใช้");
    if(u.role==="admin")fail("ลบผู้ดูแลระบบไม่ได้");
    if(db.docs.some(d=>d.coll==="subjects"&&d.owner===u.username))fail("ครูท่านนี้ยังมีรายวิชาอยู่ ให้ครูลบรายวิชาก่อน");
    db.users=db.users.filter(x=>x.username!==u.username);
    save();return {};
  }
  if(name==="importRoster"){
    const s=sess();need(s,["admin"]);
    const rooms=p.rooms||[];
    if(!rooms.length)fail("ไม่พบรายชื่อในไฟล์");
    const oldPw={};db.students.forEach(x=>oldPw[x.id]=x.pass||"");
    const byCode={};let maxN=0;
    db.rooms.forEach(r=>{byCode[r.code]=r.rid;const n=Number(String(r.rid).replace(/\D/g,""))||0;if(n>maxN)maxN=n});
    const keep={},roomRows=[],stuRows=[],seen={};
    rooms.forEach((r,i)=>{
      const code=String(r.code||"").trim().slice(0,40);
      if(!code||!(r.students||[]).length)return;
      const nextN=byCode[code]?0:(++maxN);
      const rid=byCode[code]||("r"+(nextN<10?"0"+nextN:String(nextN)));
      byCode[code]=rid;keep[rid]=1;
      roomRows.push({rid,code,major:String(r.major||"").slice(0,80),level:String(r.level||"").slice(0,20),advisor:String(r.advisor||"").slice(0,120),order:i+1});
      r.students.forEach(x=>{
        const id=String(x[0]||"").replace(/\D/g,"");
        if(!id||seen[id])return;seen[id]=1;
        stuRows.push({id,first:String(x[1]||"").trim().slice(0,80),last:String(x[2]||"").trim().slice(0,80),rid,pass:oldPw[id]||""});
      });
    });
    db.rooms.forEach(r=>{if(!keep[r.rid])roomRows.push({...r,order:9999})});
    db.rooms=roomRows;db.students=stuRows;save();
    return {rooms:Object.keys(keep).length,students:stuRows.length,list:roomsWithStu()};
  }
  if(name==="resetStudent"){
    const s=sess();need(s,["admin","teacher"]);
    const st=db.students.find(x=>String(x.id).trim()===String(p.id).trim());
    if(!st)fail("ไม่พบนักศึกษา");
    st.pass="";save();return {};
  }
  fail("คำขอไม่ถูกต้อง");
}

function getApiUrl(){
  try{
    const q=new URLSearchParams(location.search).get("api");
    if(q&&/^https:\/\/script\.google\.com\/macros\/s\//.test(q)){localStorage.setItem("ca_api_url",q);return q}
    return DEFAULT_API_URL||localStorage.getItem("ca_api_url")||"";
  }catch(e){return DEFAULT_API_URL}
}
function handleApiResult(o,res,rej){
  if(o&&o.ok){res(o.data);return}
  if(o&&o.error==="SESSION"){sessionExpired();render();rej({message:"หมดเวลาเข้าสู่ระบบ กรุณาเข้าใหม่"});return}
  rej({message:(o&&o.error)||"เกิดข้อผิดพลาด กรุณาลองใหม่"});
}
function call(name,payload){
  const body={token:TOKEN,...payload};
  if(typeof google!=="undefined"&&google.script&&google.script.run){
    return new Promise((res,rej)=>{
      google.script.run
        .withSuccessHandler(r=>{let o;try{o=JSON.parse(r)}catch(e){rej({message:"เกิดข้อผิดพลาด กรุณาลองใหม่"});return}handleApiResult(o,res,rej)})
        .withFailureHandler(()=>rej({message:"เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (หากเปิดหลายบัญชี Google ในมือถือ ให้เปิดในแท็บไม่ระบุตัวตน หรือใช้ลิงก์ทางเข้าตรง)"}))
        .api(name,JSON.stringify(body));
    });
  }
  const url=getApiUrl();
  if(!url){return new Promise((res,rej)=>{try{res(localApi(name,body))}catch(e){handleApiResult({ok:false,error:e.userMessage||e.message},res,rej)}})}
  return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name,payload:body})})
    .then(r=>r.json())
    .then(o=>new Promise((res,rej)=>handleApiResult(o,res,rej)))
    .catch(e=>Promise.reject({message:e&&e.message?e.message:"เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่"}));
}
function sessionExpired(){TOKEN=null;try{localStorage.removeItem("ca_token")}catch(e){}S.role=null;S.sid=null;S.form=null;S.search=false;S.ssid=null;S.cred=null}
function dlBlob(filename,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
const pend={},chain={};
let inflight=0;
function setStatus(s){const el=document.getElementById("status");el.hidden=false;el.dataset.s=s;document.getElementById("status-t").textContent={saving:"กำลังบันทึก…",saved:"บันทึกแล้ว",error:"บันทึกไม่สำเร็จ"}[s]}
function save(c,id,getData,now){
  const k=c+"/"+id;
  clearTimeout(pend[k]);
  setStatus("saving");
  const run=()=>{
    delete pend[k];
    inflight++;
    chain[k]=(chain[k]||Promise.resolve())
      .then(()=>call("save",{coll:c,id,data:getData()}))
      .then(()=>{inflight=Math.max(0,inflight-1);if(!Object.keys(pend).length&&!inflight)setStatus("saved")},
            e=>{inflight=Math.max(0,inflight-1);setStatus("error");toast(e.message||"บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง")});
  };
  if(now)run();else pend[k]=setTimeout(run,900);
}

function attStat(id){const c={P:0,L:0,E:0,A:0};const ds=sessions();ds.forEach(d=>c[mark(d,id)]++);return {...c,n:ds.length,pct:ds.length?Math.round((ds.length-c.A)/ds.length*100):null}}
const subOf=(tid,id)=>{const x=S.subs[tid]?.[id],w=S.work[tid]?.[id];if(w&&(!x||(x.st==="none"&&!x.rej)))return {st:w.late?"late":"sent",score:x?.score??null};return x||{st:"none",score:null}};
function workPct(sub,id){const max=sub.tasks.reduce((a,t)=>a+(+t.max||0),0);if(!max)return 0;return sub.tasks.reduce((a,t)=>a+(+subOf(t.id,id).score||0),0)/max}
const r1=x=>Math.round(x*10)/10;
const workScore=(sub,id)=>r1(workPct(sub,id)*sub.weights.work);
function total(sub,id){return r1(workScore(sub,id)+(+S.exams.mid[id]||0)+(+S.exams.fin[id]||0))}
function grade(sub,id){const a=attStat(id);if(a.pct!=null&&a.pct<MIN_ATT)return "มส.";const den=(sub.tasks.length?sub.weights.work:0)+(S.exams.mid[id]!=null?sub.weights.mid:0)+(S.exams.fin[id]!=null?sub.weights.final:0);if(!den)return "-";const p=total(sub,id)/den*100;return p>=80?"4":p>=75?"3.5":p>=70?"3":p>=65?"2.5":p>=60?"2":p>=55?"1.5":p>=50?"1":"0"}
const meter=p=>p==null?`<span class="note">ยังไม่มีข้อมูล</span>`:`<div class="mrow"><div class="meter ${p<MIN_ATT?"bad":p<88?"warn":""}"><i style="width:${p}%"></i></div><span>${p}%</span></div>`;

async function boot(){
  try{TOKEN=localStorage.getItem("ca_token")}catch(e){}
  if(!TOKEN){S.loading=false;render();return}
  await loadBoot();
}
async function loadBoot(){
  S.loading=true;S.err=null;render();
  try{const d=await call("boot",{});S.name=d.name;uid=d.name;
    if(d.role==="student"){S.me=d.me;S.sSubjects=d.subjects;S.ssid=null}
    else{S.rooms=d.rooms.sort((a,b)=>(a.order||0)-(b.order||0));
      if(d.role==="teacher"){S.subjects=d.subjects.sort((a,b)=>(a.created||0)-(b.created||0));S.todaySids=new Set(d.todaySids)}else S.users=d.users}
    S.sid=null;S.form=null;S.search=false;S.role=d.role;
  }catch(e){if(TOKEN)S.err=e.message;else toast(e.message)}
  S.loading=false;render();
}
async function openSubject(sid,stuId){

function parseRoster(files){return Promise.all([...files].map(f=>f.arrayBuffer().then(buf=>{const wb=XLSX.read(buf,{type:"array"}),lvF=(f.name.match(/ปว[ชส]\.\d/)||[])[0];
  return wb.SheetNames.map(n=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""});
    const headText=rows.slice(0,6).map(r=>r.join(" ").trim()).join("\n");
    const m=headText.match(/(?:สาขาวิชา|แผนกวิชา)\s*([^\n(]+?)\s*\(([^)]+)\)/);
    const advM=headText.match(/(?:อาจารย์ที่ปรึกษา|ครูที่ปรึกษา)\s*([^\n]+)/);
    const code=(m?m[2]:n).trim(),lv=lvF||((code.startsWith("ส")?"ปวส.":"ปวช.")+((code.match(/\.(\d)/)||[])[1]||""));
    const students=rows.slice(4).filter(r=>/^\d{8,13}$/.test(String(r[1]??"").replace(/\.0+$/,"").trim())).map(r=>[String(r[1]).replace(/\.0+$/,"").trim(),String(r[2]??"").trim(),String(r[3]??"").trim()]);
    const advisor=advM?advM[1].replace(/\s+/g," ").trim():String((rows[3]||[])[0]||"").replace(/^(?:อาจารย์ที่ปรึกษา|ครูที่ปรึกษา)\s*/,"").replace(/\s+/g," ").trim();
    return {code,major:m?m[1].trim():"",level:lv,advisor,students}}).filter(r=>r.students.length)}))).then(a=>a.flat())}

const fileB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(f)});

  if(b.dataset.rmroom){S.form.rooms=S.form.rooms.filter(x=>x!==b.dataset.rmroom);fillRooms();return}
  if(b.dataset.newsubj){S.search=false;S.sid=null;S.form={id:null,name:"",code:"",sched:"",rooms:[]};render();scrollTo(0,0);return}
  if(b.dataset.subj){openSubject(b.dataset.subj);return}
  if(b.id==="form-cancel"){const id=S.form.id;S.form=null;if(id){S.sid=id;render()}else goHome();return}

  if(b.id==="subj-del"){if(S.confirm!=="subj"){S.confirm="subj";Object.assign(S.form,{name:document.getElementById("f-name").value,code:document.getElementById("f-code").value,sched:document.getElementById("f-sched").value});keep();return}

    goHome();return}
  if(!sub)return;
  if(b.dataset.stu){S.stuY=scrollY;S.stu=b.dataset.stu;render();scrollTo(0,0);return}
  if(b.id==="stu-back"){S.stu=null;render();scrollTo(0,S.stuY||0);return}

  if(b.id==="print-att"){if(!sessions().length){toast("ยังไม่มีการเช็กชื่อในวิชานี้");return}printAtt(sub);return}

  if(b.dataset.tab){S.form=null;S.stu=null;S.tab=b.dataset.tab;S.task=null;render();scrollTo(0,0);return}
  if(b.dataset.room){keep(()=>S.room=b.dataset.room);return}
  if(b.dataset.date){keep(()=>S.date=b.dataset.date);return}
  if(b.dataset.att){const id=b.dataset.att,k=b.dataset.s;S.att[S.date]??={m:{}};const m=S.att[S.date].m;if(k==="P")delete m[id];else m[id]=k;saveAtt();keep();return}
  if(b.id==="all-present"){S.att[S.date]??={m:{}};const m=S.att[S.date].m;visible().forEach(s=>delete m[s.id]);saveAtt();keep();return}
  if(b.id==="save-att"){saveAtt(true);keep();toast("บันทึกการเช็กชื่อ "+thaiDate(S.date)+" แล้ว");return}
  if(b.dataset.task){S.task=b.dataset.task;render();scrollTo(0,0);return}
  if(b.id==="task-back"){S.task=null;render();return}
  if(b.dataset.sub){const m=(S.subs[S.task]??={});const x=m[b.dataset.sub]??={st:"none",score:null};x.st=b.dataset.v;x.rej=x.st==="none";if(x.st==="none")x.score=null;saveSubs(S.task);keep();return}
  if(b.id==="all-sent"){const m=(S.subs[S.task]??={});visible().forEach(s=>{const x=m[s.id]??={st:"none",score:null};if(x.st==="none"){x.st="sent";delete x.rej}});saveSubs(S.task);keep();return}
  if(b.id==="task-del"){if(S.confirm!=="task"){S.confirm="task";keep();return}const tid=S.task;sub.tasks=sub.tasks.filter(t=>t.id!==tid);delete S.subs[tid];delete S.work[tid];S.task=null;S.confirm=null;saveSubj(sub,true);call("remove",{coll:"subs",id:sub._id+"_"+tid,sid:sub._id}).catch(()=>{});render();toast("ลบงานแล้ว");return}
  if(b.dataset.export){xlsxExport(sub);return}
  if(b.id==="pick"){const here=STU.filter(s=>mark(S.date,s.id)!=="A");if(!here.length)return;const p=here[Math.floor(Math.random()*here.length)];S.picked=p.id;document.getElementById("picked").textContent=p.name;return}
  if(b.id==="make-groups"){const n=Math.min(20,Math.max(2,+document.getElementById("ngroups").value||6));S.ng=n;const a=STU.filter(s=>mark(S.date,s.id)!=="A").map(s=>s.name.replace(/^(นาย|นางสาว|นาง)/,""));for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}S.groups=Array.from({length:n},()=>[]);a.forEach((x,k)=>S.groups[k%n].push(x));keep();return}
  if(b.id==="log"){const t=document.getElementById("log-text").value.trim();if(!t){toast("พิมพ์บันทึกก่อน");return}(sub.logs??=[]).unshift({d:TODAY,t});sub.logs=sub.logs.slice(0,200);saveSubj(sub,true);keep();toast("บันทึกหลังการสอนแล้ว");return}
  if(b.dataset.addt){S.timer+=+b.dataset.addt;document.getElementById("timer").textContent=fmt(S.timer);return}
  if(b.id==="timer-go"){if(S.timerOn){clearInterval(S.timerOn);S.timerOn=null}else if(S.timer>0){S.timerOn=setInterval(()=>{S.timer=Math.max(0,S.timer-1);const el=document.getElementById("timer");if(el)el.textContent=fmt(S.timer);if(!S.timer){clearInterval(S.timerOn);S.timerOn=null;toast("หมดเวลา");const g=document.getElementById("timer-go");if(g)g.textContent="เริ่ม"}},1000)}b.textContent=S.timerOn?"หยุด":"เริ่ม";return}
  if(b.id==="timer-reset"){clearInterval(S.timerOn);S.timerOn=null;S.timer=0;keep();return}
});
document.addEventListener("input",e=>{const t=e.target,sub=subj();
  if(t.id==="rq"){fillRooms();return}
  if(t.id==="gq"){S.gq=t.value;fillResults();return}
  if(t.id==="q"){S.q=t.value;const q=S.q.trim().toLowerCase();document.querySelectorAll("tr[data-k]").forEach(tr=>tr.hidden=!!q&&!tr.dataset.k.includes(q));return}
  if(!sub)return;
  const num=(v,max)=>{if(v===""||v==null)return null;const lim=max!=null&&max!==""?+max:1e9;return Math.min(isNaN(lim)?1e9:lim,Math.max(0,+v||0))};
  if(t.dataset.ts){
    const id=t.dataset.ts,cur=subOf(S.task,id),m=(S.subs[S.task]??={}),x=m[id]??={st:cur.st==="none"?"sent":cur.st,score:null};
    if(!x.st||x.st==="none")x.st=cur.st==="late"?"late":"sent";
    delete x.rej;
    const tk=sub.tasks.find(k=>k.id===S.task);
    x.score=num(t.value,tk?tk.max:null);
    if(x.score!=null&&Number(t.value)!==x.score)t.value=x.score;
    saveSubs(S.task);
  }
  if(t.dataset.ex){
    const id=t.dataset.id,k=t.dataset.ex,v=num(t.value,k==="mid"?sub.weights.mid:sub.weights.final);
    if(v==null)delete S.exams[k][id];else{S.exams[k][id]=v;if(Number(t.value)!==v)t.value=v}
    saveExams();
    document.getElementById("tot-"+id).innerHTML=`<b>${total(sub,id)}</b>`;
    document.getElementById("gr-"+id).innerHTML=gradeCell(grade(sub,id));
  }
  if(["w-work","w-mid","w-final"].includes(t.id)){sub.weights[t.id.slice(2)]=Math.max(0,+t.value||0);const sum=sub.weights.work+sub.weights.mid+sub.weights.final;const p=document.getElementById("w-sum");p.textContent="รวม "+sum;p.className="pill "+(sum===100?"p-ok":"p-bad");saveSubj(sub)}
});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="roster-files"&&t.files.length){if(!window.XLSX){toast("โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ กรุณาเปิดหน้านี้ใหม่");return}try{S.rosterPrev=await parseRoster(t.files);if(!S.rosterPrev.length){S.rosterPrev=null;toast("ไม่พบรายชื่อในไฟล์ที่เลือก")}render()}catch(err){toast("อ่านไฟล์ไม่ได้ ตรวจสอบว่าเป็นไฟล์ .xlsx")}return}
  if(["w-work","w-mid","w-final"].includes(t.id))keep();
  if(t.id==="att-date"&&t.value){keep(()=>S.date=t.value)}
});
document.addEventListener("submit",async e=>{e.preventDefault();
  if(await extraSubmit(e.target))return;
  if(e.target.id==="subj-form"){const name=document.getElementById("f-name").value.trim(),rooms=[...S.form.rooms];
    if(!name){toast("กรอกชื่อวิชาก่อน");return}if(!rooms.length){toast("เลือกห้องที่สอนอย่างน้อย 1 ห้อง");return}
    const code=document.getElementById("f-code").value.trim(),sched=document.getElementById("f-sched").value.trim();let sub;
    if(S.form.id){sub=S.subjects.find(x=>x._id===S.form.id);Object.assign(sub,{name,code,sched,rooms})}
    else{sub={_id:newId("s"),owner:uid,name,code,sched,rooms,color:COLORS[S.subjects.length%COLORS.length],weights:{work:60,mid:20,final:20},tasks:[],logs:[],created:Date.now()};S.subjects.push(sub)}
    saveSubj(sub,true);const isNew=!S.form.id;S.form=null;
    if(isNew)openSubject(sub._id);else{S.sid=sub._id;STU=studentsOf(sub);if(S.room!=="all"&&!rooms.includes(S.room))S.room="all";render()}
    toast(isNew?"เพิ่มรายวิชาแล้ว":"บันทึกรายวิชาแล้ว");return}
  if(e.target.id==="task-form"){const sub=subj(),name=document.getElementById("task-name").value.trim();if(!name)return;
    sub.tasks.push({id:newId("t"),t:name,max:Math.max(1,+document.getElementById("task-max").value||10),due:document.getElementById("task-due").value||TODAY});saveSubj(sub,true);render();toast("สั่งงานแล้ว")}
});
window.addEventListener("beforeunload",e=>{if(Object.keys(pend).length||inflight){e.preventDefault();e.returnValue=""}});
render();boot();
</script>
